<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Teacher's Day, Ma'am! 🌷</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4ec, #fff5d7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: #4a3040;
        }

        .card {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
            animation: fadeIn 1.2s ease;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #d94f70;
        }

        .subtitle {
            font-size: 17px;
            margin-bottom: 20px;
        }

        /* VIDEO */
        .video-container {
            display: flex;
            justify-content: center;
            margin: 20px 0 25px;
        }

        video {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            border-radius: 18px;
            background: #222;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .choose {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .flower {
            background: #ff9fbd;
            color: white;
        }

        .chocolate {
            background: #9b6a4a;
            color: white;
        }

        button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 15px rgba(0,0,0,0.18);
        }

        #message {
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            background: #fff0f5;
            display: none;
            animation: pop 0.5s ease;
            font-size: 17px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #80616d;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 15px;
            }

            video {
                max-width: 280px;
            }

            button {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🌷 Happy Teacher's Day, Ma'am! 🌷</h1>

        <p class="subtitle">
            A little surprise just for you 💗
        </p>

        <!-- PORTRAIT VIDEO -->
        <div class="video-container">

            <video controls playsinline>
                <source src="mp4.mp4" type="video/mp4">

                
            </video>

        </div>

        <p class="choose">
            💝 Choose your surprise:
        </p>

        <div class="choices">

            <button class="flower" onclick="chooseFlower()">
                🌸 Flowers
            </button>

            <button class="chocolate" onclick="chooseChocolate()">
                🍫 Chocolate
            </button>

        </div>

        <div id="message"></div>

        <div class="footer">
            Made with appreciation and gratitude 💐
        </div>

    </div>


    <script>

        function chooseFlower() {

            const message = document.getElementById("message");

            message.style.display = "block";

            message.innerHTML = `
                🌸 <strong>Flowers for Ma'am!</strong> 🌸
                <br><br>
                Just like flowers make a place beautiful,
                your kindness and dedication make our classroom
                a better place. 💗
                <br><br>
                Thank you for everything you do for us, Ma'am! 🌷
            `;

        }


        function chooseChocolate() {

            const message = document.getElementById("message");

            message.style.display = "block";

            message.innerHTML = `
                🍫 <strong>Chocolate for Ma'am!</strong> 🍫
                <br><br>
                A little sweetness for someone who makes
                learning a lot more meaningful and enjoyable. 💕
                <br><br>
                Happy Teacher's Day, Ma'am! Thank you for
                your patience, guidance, and kindness! 🥰
            `;

        }

    </script>

</body>
</html>
